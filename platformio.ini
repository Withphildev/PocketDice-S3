[platformio]
default_envs = m5sticks3
src_dir = firmware/src
lib_dir = core

[env:m5sticks3]
platform = espressif32
board = m5stack-sticks3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
  m5stack/M5Unified
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DPOCKETDICE_MAX_PLAYERS=6
  -std=gnu++17
build_unflags =
  -std=gnu++11

